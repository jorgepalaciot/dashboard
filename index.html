<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Dashboard</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0F1419; --dim:#536471; --line:#EBEEF0; --steel:#3D5A80; --amber:#EE6C4D; --paper:#F7F4EE; --hi:#D64545; --mid:#D6A72A; --lo:#4C7A5A; --bg:#fff; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:60px;}
  header.top{padding:20px 18px 4px;}
  header.top .greeting{font-size:23px;font-weight:700;margin:0;}
  header.top .date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--dim);text-transform:uppercase;margin-top:2px;}
  .navlink{display:inline-block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:14px;}
  .ticker-wrap{background:var(--ink);overflow:hidden;white-space:nowrap;padding:8px 0;margin-top:14px;}
  .ticker-track{display:inline-block;padding-left:100%;animation:scroll-left 32s linear infinite;}
  .ticker-track span{color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-right:34px;}
  .ticker-track span b{color:var(--amber);}
  @keyframes scroll-left{ from{transform:translateX(0);} to{transform:translateX(-100%);} }
  section{padding:18px;border-bottom:8px solid var(--paper);}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .section-title h2{font-size:15px;margin:0;font-weight:700;}
  .section-title .score-badge{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--steel);}
  .task-row,.area-task-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .task-row:last-child,.area-task-row:last-child{border-bottom:none;}
  .task-check,.area-task-check{border-radius:50%;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .task-check{width:20px;height:20px;font-size:12px;}
  .area-task-check{width:18px;height:18px;font-size:11px;}
  .task-check.done,.area-task-check.done{background:var(--lo);border-color:var(--lo);color:#fff;}
  .task-priority,.area-task-priority{align-self:stretch;border-radius:2px;flex:0 0 auto;}
  .task-priority{width:4px;}
  .area-task-priority{width:3px;}
  .task-priority.alta,.area-task-priority.alta{background:var(--hi);}
  .task-priority.media,.area-task-priority.media{background:var(--mid);}
  .task-priority.baja,.area-task-priority.baja{background:var(--lo);}
  .task-title,.area-task-title{flex:1;font-size:14.5px;}
  .task-title.done,.area-task-title.done{text-decoration:line-through;color:var(--dim);}
  .task-area-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--steel);background:var(--paper);padding:2px 8px;border-radius:10px;}
  .add-btn{width:100%;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:none;font-family:'Space Grotesk',sans-serif;font-size:13.5px;color:var(--steel);cursor:pointer;}
  .inline-form{display:none;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .inline-form input[type=text]{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;}
  .inline-form select{padding:9px;border:1px solid var(--line);border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;}
  .inline-form button{border:none;background:var(--amber);color:#fff;font-weight:600;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer;}
  .empty{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);padding:8px 0;}
  .history-toggle{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);cursor:pointer;text-decoration:underline;}
  .history-chart{display:none;align-items:flex-end;gap:4px;height:70px;margin-top:12px;}
  .history-bar{flex:1;background:var(--steel);border-radius:3px 3px 0 0;min-height:2px;position:relative;}
  .history-bar .lbl{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim);}
  .areas-grid{display:flex;flex-wrap:wrap;gap:16px;}
  .area-card{flex:0 0 auto;width:96px;text-align:center;cursor:pointer;}
  .area-card svg{transform:rotate(-90deg);}
  .area-card .pct{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
  .area-card .lbl{font-size:11.5px;margin-top:4px;line-height:1.3;}
  .area-detail{display:none;margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px;}
  .area-detail .section-subtitle{font-weight:600;font-size:13px;margin:12px 0 8px;color:var(--steel);}
  .area-detail .section-subtitle:first-of-type{margin-top:0;}
  .area-detail .item-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;}
  .area-detail .item-row.done .item-label{text-decoration:line-through;color:var(--dim);}
  .item-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;}
  .item-check.done{background:var(--lo);border-color:var(--lo);}
  .today-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 10px;border-radius:10px;border:1px solid var(--steel);background:transparent;color:var(--steel);cursor:pointer;}
  .today-toggle.active{background:var(--steel);color:#fff;}
  .app-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .app-row:last-child{border-bottom:none;}
  .app-head{display:flex;justify-content:space-between;align-items:center;}
  .app-name{font-size:14px;font-weight:600;}
  .app-type{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);text-transform:uppercase;}
  .status-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:12px;background:#F7F8F8;border:1px solid var(--line);cursor:pointer;}
  .app-notes{font-size:12.5px;color:var(--dim);margin-top:2px;}
  .loading{padding:30px 18px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-box{background:#fff;border-radius:16px;padding:24px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.2);}
  .modal-box h3{margin:0 0 6px;font-size:17px;}
  .modal-box p{margin:6px 0 16px;font-size:14px;color:var(--dim);}
  .modal-box .modal-buttons{display:flex;gap:10px;justify-content:center;}
  .modal-box .modal-buttons button{padding:8px 24px;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;}
  .modal-box .modal-buttons .confirm{background:var(--lo);color:#fff;}
  .modal-box .modal-buttons .cancel{background:var(--line);color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="greeting" id="greeting">Buenos días</div>
    <div class="date" id="today"></div>
    <a class="navlink" href="noticias.html">Ver noticias relevantes →</a>
  </header>

  <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"><span>Cargando…</span></div></div>

  <div id="loadingMsg" class="loading">Cargando tu dashboard…</div>

  <div id="content" style="display:none;">
    <section id="tasksSection">
      <div class="section-title"><h2>Tareas de hoy</h2><span class="score-badge" id="scoreBadge">0 / 0</span></div>
      <div id="tasksList"></div>
      <button class="add-btn" id="showTaskForm">+ Agregar tarea</button>
      <div class="inline-form" id="taskForm">
        <input type="text" id="taskTitleInput" placeholder="¿Qué tarea?" maxlength="120">
        <select id="taskPriorityInput">
          <option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option>
        </select>
        <select id="taskAreaInput"><option value="">Ninguna</option></select>
        <button id="saveTaskBtn">Agregar</button>
      </div>
      <div style="margin-top:12px;">
        <span class="history-toggle" id="historyToggle">Ver historial de puntaje</span>
        <div class="history-chart" id="historyChart"></div>
      </div>
    </section>

    <section id="areasSection">
      <div class="section-title"><h2>Progreso — mediano plazo</h2></div>
      <div class="areas-grid" id="areasGrid"></div>
      <button class="add-btn" id="showAreaForm">+ Nueva área</button>
      <div class="inline-form" id="areaForm">
        <input type="text" id="areaLabelInput" placeholder="Nombre del área" maxlength="60">
        <button id="saveAreaBtn">Crear</button>
      </div>
      <div class="area-detail" id="areaDetail"></div>
    </section>

    <section id="appsSection">
      <div class="section-title"><h2>Postulaciones</h2></div>
      <div id="appsList"></div>
      <button class="add-btn" id="showAppForm">+ Agregar postulación</button>
      <div class="inline-form" id="appForm">
        <input type="text" id="appNameInput" placeholder="Nombre (empresa, beca, master...)" maxlength="80">
        <select id="appTypeInput">
          <option value="Trabajo">Trabajo</option><option value="Voluntariado">Voluntariado</option>
          <option value="Master">Master</option><option value="Beca">Beca</option>
        </select>
        <button id="saveAppBtn">Agregar</button>
      </div>
    </section>
  </div>
</div>

<div class="modal-overlay" id="confirmModal" style="display:none;">
  <div class="modal-box">
    <h3 id="modalTitle">¿Confirmar?</h3>
    <p id="modalMessage">¿Estás seguro que quieres completar esta tarea?</p>
    <div class="modal-buttons">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="confirm" id="modalConfirm">Sí, completar</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxDJpaz28q8na4KaBCU5032awqUuqD9fzSGlSmUwbV_teKep9LHKPWa8KWK4oo43aga9w/exec";
  const NOMBRE_USUARIO = "Jorge";
  const STATUS_OPTIONS = ['Postulado','Entrevista','Esperando respuesta','Aceptado','Rechazado'];

  let lastData = null;
  let selectedAreaId = null;

  // ---------- Saludo ----------
  (function setGreeting(){
    const h = new Date().getHours();
    const g = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
    document.getElementById('greeting').textContent = `${g}, ${NOMBRE_USUARIO}`;
  })();
  document.getElementById('today').textContent = new Date().toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long' });

  // ---------- Modal de confirmación ----------
  function showConfirm(title, message){
    return new Promise(resolve => {
      const modal = document.getElementById('confirmModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      modal.style.display = 'flex';
      document.getElementById('modalConfirm').onclick = () => { modal.style.display='none'; resolve(true); };
      document.getElementById('modalCancel').onclick = () => { modal.style.display='none'; resolve(false); };
    });
  }

  // Toggle genérico con confirmación al marcar como hecho (usado por tareas, tareas de área e items).
  async function toggleWithConfirm(action, id, currentDone, label){
    const newDone = !currentDone;
    if(newDone && !(await showConfirm('✅ Completar', `¿Estás seguro que quieres completar "${label}"?`))) return;
    await postSilent({ action, id, done: newDone });
    await loadDashboard(true);
  }

  // ---------- JSONP ----------
  function fetchJSONP(url){
    return new Promise((resolve, reject) => {
      const cbName = 'jsonpCb_' + Date.now() + Math.floor(Math.random()*1000);
      window[cbName] = data => { resolve(data); delete window[cbName]; s.remove(); };
      const s = document.createElement('script');
      s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      s.onerror = () => reject(new Error('JSONP failed'));
      document.body.appendChild(s);
    });
  }
  const postSilent = body => fetch(API_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(body) });

  // ---------- Ticker ----------
  async function loadTicker(){
    let dollarTxt = 'USD→PEN: ...', weatherTxt = 'Clima: ...';
    try{
      const d = await (await fetch('https://open.er-api.com/v6/latest/USD')).json();
      if(d.rates && d.rates.PEN) dollarTxt = `USD → PEN <b>${d.rates.PEN.toFixed(3)}</b>`;
    }catch(e){}
    try{
      const d = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=-12.12&longitude=-77.03&current=temperature_2m,relative_humidity_2m')).json();
      if(d.current) weatherTxt = `Miraflores <b>${Math.round(d.current.temperature_2m)}°C</b> · Humedad <b>${d.current.relative_humidity_2m}%</b>`;
    }catch(e){}
    const dateTxt = new Date().toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const html = `<span>${dollarTxt}</span><span>${weatherTxt}</span><span>${dateTxt}</span>`;
    document.getElementById('tickerTrack').innerHTML = html + html;
  }

  // ---------- Renderizado ----------
  function renderAll(data){
    if(!data) return;
    lastData = data;
    renderTasks(data.tasks);
    renderScore(data.scoreDone || 0, data.scoreTotal || 0);
    renderHistory(data.scoreHistory);
    renderAreas(data.areas);
    renderApps(data.applications);
    if(selectedAreaId) renderAreaDetail();
  }

  function renderTasks(tasks){
    const el = document.getElementById('tasksList');
    if(!tasks || !tasks.length){ el.innerHTML = '<div class="empty">Sin tareas para hoy. ¡Agrega una!</div>'; return; }
    const order = { alta:0, media:1, baja:2 };
    tasks.sort((a,b) => (a.done - b.done) || (order[a.priority]-order[b.priority]));
    const areaMap = {};
    (lastData.areas || []).forEach(a => areaMap[a.id] = a.label);

    el.innerHTML = tasks.map(t => {
      const isDone = t.done === true || t.done === 'true';
      const areaLabel = t.areaId && areaMap[t.areaId] || '';
      return `
        <div class="task-row">
          <div class="task-priority ${t.priority}"></div>
          <div class="task-check ${isDone?'done':''}" data-id="${t.id}" data-done="${isDone}">${isDone?'✓':''}</div>
          <div class="task-title ${isDone?'done':''}">${t.title} ${areaLabel ? `<span class="task-area-tag">${areaLabel}</span>` : ''}</div>
        </div>`;
    }).join('');

    el.querySelectorAll('.task-check').forEach(chk => {
      chk.addEventListener('click', () => {
        const task = tasks.find(t => t.id === chk.dataset.id);
        toggleWithConfirm('toggleTask', chk.dataset.id, chk.dataset.done === 'true', task.title);
      });
    });
  }

  const renderScore = (done, total) => document.getElementById('scoreBadge').textContent = `${done} / ${total}`;

  function renderHistory(history){
    const el = document.getElementById('historyChart');
    if(!history || !history.length){ el.innerHTML = '<div class="empty">Aún no hay historial.</div>'; return; }
    el.innerHTML = [...history].reverse().slice(-14).map(r => `
      <div class="history-bar" style="height:${Math.max(r.score,3)}%;"><span class="lbl">${r.date.slice(5)}</span></div>
    `).join('');
  }

  function renderAreas(areas){
    const grid = document.getElementById('areasGrid');
    if(!areas || !areas.length){ grid.innerHTML = '<div class="empty">Sin áreas creadas. Crea una con "+ Nueva área"</div>'; return; }
    const c = 2*Math.PI*30;
    grid.innerHTML = areas.map(a => `
      <div class="area-card" data-id="${a.id}">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="30" stroke="#EBEEF0" stroke-width="7" fill="none"/>
          <circle cx="36" cy="36" r="30" stroke="#3D5A80" stroke-width="7" fill="none"
            stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - a.percent/100)}" stroke-linecap="round"/>
        </svg>
        <div class="pct">${a.percent}%</div>
        <div class="lbl">${a.label}</div>
      </div>`).join('');
    grid.querySelectorAll('.area-card').forEach(card => {
      card.addEventListener('click', () => { selectedAreaId = card.dataset.id; renderAreaDetail(); });
    });
  }

  function renderAreaDetail(){
    const detail = document.getElementById('areaDetail');
    const area = lastData && lastData.areas && lastData.areas.find(a => a.id === selectedAreaId);
    if(!area){ detail.style.display = 'none'; return; }
    detail.style.display = 'block';

    const itemsHtml = (area.items && area.items.length) ? area.items.map(i => `
      <div class="item-row ${i.done?'done':''}">
        <div class="item-check ${i.done?'done':''}" data-id="${i.id}" data-done="${i.done}"></div>
        <div class="item-label">${i.label}</div>
      </div>`).join('') : '<div class="empty">Sin items de progreso aún.</div>';

    const areaTasks = area.tasks || [];
    const tasksHtml = areaTasks.length ? areaTasks.map(t => {
      const isToday = t.isToday === true || t.isToday === 'true';
      const isDone = t.done === true || t.done === 'true';
      const prColor = t.priority === 'alta' ? 'var(--hi)' : t.priority === 'media' ? 'var(--mid)' : 'var(--lo)';
      return `
        <div class="area-task-row">
          <div class="area-task-priority" style="background:${prColor};"></div>
          <div class="area-task-check ${isDone?'done':''}" data-id="${t.id}" data-done="${isDone}">${isDone?'✓':''}</div>
          <div class="area-task-title ${isDone?'done':''}">${t.title}</div>
          <button class="today-toggle ${isToday?'active':''}" data-id="${t.id}" data-today="${isToday}">${isToday?'✓ Hoy':'+ Hoy'}</button>
        </div>`;
    }).join('') : '<div class="empty">Sin tareas asociadas a esta área.</div>';

    detail.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;font-size:16px;">${area.label}</div>
      <div class="section-subtitle">📋 Items de progreso</div>
      ${itemsHtml}
      <div class="inline-form" style="display:flex;margin-top:8px;">
        <input type="text" id="newItemInput" placeholder="Nuevo item de progreso..." maxlength="80">
        <button id="saveItemBtn">+</button>
      </div>
      <div class="section-subtitle" style="margin-top:16px;">📌 Tareas asociadas</div>
      ${tasksHtml}
      <div class="inline-form" style="display:flex;margin-top:8px;">
        <input type="text" id="newAreaTaskInput" placeholder="Nueva tarea del área..." maxlength="120">
        <select id="newAreaTaskPriority">
          <option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option>
        </select>
        <button id="saveAreaTaskBtn">+</button>
      </div>`;

    detail.querySelectorAll('.item-check').forEach(chk => {
      chk.addEventListener('click', () => {
        const item = area.items.find(i => i.id === chk.dataset.id);
        toggleWithConfirm('toggleAreaItem', chk.dataset.id, chk.dataset.done === 'true', item.label);
      });
    });
    detail.querySelectorAll('.area-task-check').forEach(chk => {
      chk.addEventListener('click', () => {
        const task = areaTasks.find(t => t.id === chk.dataset.id);
        toggleWithConfirm('toggleTask', chk.dataset.id, chk.dataset.done === 'true', task.title);
      });
    });
    detail.querySelectorAll('.today-toggle').forEach(btn => {
      btn.addEventListener('click', async () => {
        await postSilent({ action:'toggleTaskToday', id: btn.dataset.id, isToday: btn.dataset.today !== 'true' });
        await loadDashboard(true);
      });
    });
    document.getElementById('saveItemBtn').addEventListener('click', async () => {
      const input = document.getElementById('newItemInput');
      if(!input.value.trim()) return;
      await postSilent({ action:'addAreaItem', areaId: selectedAreaId, label: input.value.trim() });
      await loadDashboard(true);
    });
    document.getElementById('saveAreaTaskBtn').addEventListener('click', async () => {
      const input = document.getElementById('newAreaTaskInput');
      if(!input.value.trim()) return;
      const priority = document.getElementById('newAreaTaskPriority').value;
      await postSilent({ action:'addTask', title: input.value.trim(), priority, areaId: selectedAreaId });
      await loadDashboard(true);
    });
  }

  function renderApps(apps){
    const el = document.getElementById('appsList');
    if(!apps || !apps.length){ el.innerHTML = '<div class="empty">Sin postulaciones registradas.</div>'; return; }
    el.innerHTML = apps.map(a => `
      <div class="app-row">
        <div class="app-head">
          <div><div class="app-name">${a.name}</div><div class="app-type">${a.type} · ${a.date}</div></div>
          <select class="status-badge" data-id="${a.id}">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===a.status?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        ${a.notes ? `<div class="app-notes">${a.notes}</div>` : ''}
      </div>`).join('');
    el.querySelectorAll('.status-badge').forEach(sel => {
      sel.addEventListener('change', () => postSilent({ action:'updateApplicationStatus', id: sel.dataset.id, status: sel.value }));
    });
  }

  // ---------- Formularios ----------
  function updateAreaSelector(){
    const select = document.getElementById('taskAreaInput');
    select.innerHTML = '<option value="">Ninguna</option>' + (lastData && lastData.areas ? lastData.areas.map(a => `<option value="${a.id}">${a.label}</option>`).join('') : '');
  }

  function toggleForm(btnId, formId, onShow){
    document.getElementById(btnId).addEventListener('click', () => {
      const f = document.getElementById(formId);
      f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
      if(onShow) onShow();
    });
  }
  toggleForm('showTaskForm', 'taskForm', updateAreaSelector);
  toggleForm('showAreaForm', 'areaForm');
  toggleForm('showAppForm', 'appForm');

  document.getElementById('saveTaskBtn').addEventListener('click', async () => {
    const title = document.getElementById('taskTitleInput').value.trim();
    if(!title) return;
    const priority = document.getElementById('taskPriorityInput').value;
    const areaId = document.getElementById('taskAreaInput').value;
    await postSilent({ action:'addTaskToday', title, priority, areaId });
    document.getElementById('taskTitleInput').value = '';
    await loadDashboard(true);
  });

  document.getElementById('saveAreaBtn').addEventListener('click', async () => {
    const label = document.getElementById('areaLabelInput').value.trim();
    if(!label) return;
    await postSilent({ action:'addArea', label });
    document.getElementById('areaLabelInput').value = '';
    await loadDashboard(true);
  });

  document.getElementById('saveAppBtn').addEventListener('click', async () => {
    const name = document.getElementById('appNameInput').value.trim();
    if(!name) return;
    const type = document.getElementById('appTypeInput').value;
    await postSilent({ action:'addApplication', type, name, status:'Postulado' });
    document.getElementById('appNameInput').value = '';
    await loadDashboard(true);
  });

  document.getElementById('historyToggle').addEventListener('click', () => {
    const chart = document.getElementById('historyChart');
    chart.style.display = chart.style.display === 'flex' ? 'none' : 'flex';
  });

  // ---------- Carga ----------
  async function loadDashboard(silent){
    try{
      renderAll(await fetchJSONP(API_URL + '?view=dashboard'));
      if(!silent){
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      }
    }catch(err){
      document.getElementById('loadingMsg').textContent = 'No se pudo cargar el dashboard. Revisa API_URL.';
    }
  }

  loadTicker();
  loadDashboard(false);
</script>
</body>
</html>
