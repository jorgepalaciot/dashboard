<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0F1419; --dim:#536471; --line:#EBEEF0; --steel:#3D5A80; --amber:#EE6C4D; --bg:#fff; --hover:#F7F8F8; --paper:#F7F4EE; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line);}

  header.top{position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);padding:14px 16px;border-bottom:1px solid var(--line);z-index:10;display:flex;justify-content:space-between;align-items:center;}
  header.top h1{font-size:19px;font-weight:700;margin:0;}
  .back{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);text-decoration:none;}

  .compose{display:flex;gap:8px;padding:14px 16px;border-bottom:8px solid var(--paper);}
  .compose input{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;background:var(--hover);}
  .compose input:focus{border-color:var(--steel);background:#fff;}
  .compose button{border:none;background:var(--amber);color:#fff;font-weight:600;font-size:13.5px;padding:0 18px;border-radius:20px;cursor:pointer;}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .x{opacity:.55;font-weight:700;margin-left:2px;}

  .pinned{margin:14px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#F7F4EE,#EDE8DD);}
  .pinned .pin-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--steel);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .pinned .word{font-size:20px;font-weight:700;}
  .pinned .meaning{font-size:13px;color:var(--dim);font-style:italic;margin:2px 0 8px;}
  .pinned .example{font-family:'IBM Plex Mono',monospace;font-size:12px;border-left:2px solid var(--amber);padding-left:9px;}

  .row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;}
  .row:hover{background:var(--hover);}
  .avatar{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .row-body{flex:1;min-width:0;}
  .row-head{display:flex;align-items:baseline;gap:6px;font-size:13.5px;margin-bottom:2px;}
  .row-head .topic-label{font-weight:700;}
  .row-head .time{color:var(--dim);font-size:12.5px;}
  .row-title{font-size:14.5px;line-height:1.4;}
  .row-foot{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);}

  .empty, .loading{padding:30px 16px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--dim);}
  footer{text-align:center;padding:20px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#B0A99A;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Noticias</h1>
    <a class="back" href="index.html">← Dashboard</a>
  </header>

  <div class="compose">
    <input id="topicInput" type="text" placeholder="Seguir un tema nuevo…" maxlength="80">
    <button id="addBtn">Seguir</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="pinned" id="pinnedPhrase" style="display:none;"></div>

  <div id="loadingMsg" class="loading">Cargando noticias (puede tardar ~1 min la primera vez)…</div>
  <div id="feed"></div>

  <footer>se actualiza solo cada hora · sin costo</footer>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxDJpaz28q8na4KaBCU5032awqUuqD9fzSGlSmUwbV_teKep9LHKPWa8KWK4oo43aga9w/exec";
  let currentFilter = 'all';
  let lastData = null;

  function fetchJSONP(url){
    return new Promise((resolve, reject) => {
      const cbName = 'jsonpCb_' + Date.now() + Math.floor(Math.random()*1000);
      window[cbName] = (data) => { resolve(data); delete window[cbName]; s.remove(); };
      const s = document.createElement('script');
      s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      s.onerror = () => reject(new Error('JSONP failed'));
      document.body.appendChild(s);
    });
  }
  function postSilent(body){
    return fetch(API_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(body) });
  }
  function timeAgo(pubDate){
    const d = new Date(pubDate);
    if(isNaN(d)) return '';
    const diffH = Math.round((Date.now() - d.getTime())/3600000);
    if(diffH < 1) return 'hace instantes';
    if(diffH < 24) return `${diffH} h`;
    return `${Math.round(diffH/24)} d`;
  }
  const PALETTE = ['#3D5A80','#EE6C4D','#4C7A5A','#8A5A8C','#B08628','#5A7A9A','#9A5A5A'];
  function colorFor(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return PALETTE[h % PALETTE.length]; }
  function initialsFor(label){ return label.trim().slice(0,2).toUpperCase(); }

  function renderChips(topics){
    const chipsEl = document.getElementById('chips');
    chipsEl.innerHTML = '';
    [{id:'all',label:'Todos'}, ...topics].forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (currentFilter === t.id ? ' active' : '');
      chip.innerHTML = `<span>${t.label}</span>` + (t.fixed === false ? `<span class="x" data-id="${t.id}">×</span>` : '');
      chip.addEventListener('click', (ev) => {
        if(ev.target.classList.contains('x')){ ev.stopPropagation(); removeTopic(t.id); return; }
        currentFilter = t.id; renderChips(topics); renderFeed(lastData);
      });
      chipsEl.appendChild(chip);
    });
  }
  function renderPinned(phrase){
    const el = document.getElementById('pinnedPhrase');
    if(!phrase){ el.style.display='none'; return; }
    el.style.display='block';
    el.innerHTML = `<div class="pin-lbl">📌 Frase del día</div><div class="word">${phrase.phrase}</div><div class="meaning">${phrase.meaning}</div><div class="example">"${phrase.example}"</div>`;
  }
  function renderFeed(data){
    if(!data) return;
    const topicMap = {}; data.topics.forEach(t => topicMap[t.id]=t);
    const items = data.items.filter(it => currentFilter==='all' || it.topicId===currentFilter);
    const feedEl = document.getElementById('feed');
    if(!items.length){ feedEl.innerHTML = '<div class="empty">Sin novedades por ahora en este tema.</div>'; return; }
    feedEl.innerHTML = items.map(it => {
      const topic = topicMap[it.topicId] || {label:'Tema'};
      return `
        <a class="row" href="${it.link}" target="_blank" rel="noopener">
          <div class="avatar" style="background:${colorFor(it.topicId)}">${initialsFor(topic.label)}</div>
          <div class="row-body">
            <div class="row-head"><span class="topic-label">${topic.label}</span><span class="time">· ${timeAgo(it.pubDate)}</span></div>
            <div class="row-title">${it.title}</div>
            <div class="row-foot">abrir en Chrome →</div>
          </div>
        </a>`;
    }).join('');
  }

  async function addTopic(){
    const input = document.getElementById('topicInput');
    const label = input.value.trim();
    if(!label) return;
    await postSilent({ action:'addTopic', label });
    input.value = '';
    await new Promise(r => setTimeout(r, 1200));
    await loadFeed();
  }
  async function removeTopic(id){
    await postSilent({ action:'removeTopic', id });
    if(currentFilter === id) currentFilter = 'all';
    await new Promise(r => setTimeout(r, 1000));
    await loadFeed();
  }
  document.getElementById('addBtn').addEventListener('click', addTopic);
  document.getElementById('topicInput').addEventListener('keydown', e => { if(e.key==='Enter') addTopic(); });

  async function loadFeed(){
    try{
      const data = await fetchJSONP(API_URL + '?view=news');
      lastData = data;
      renderChips(data.topics);
      renderPinned(data.englishPhrase);
      renderFeed(data);
      document.getElementById('loadingMsg').style.display = 'none';
    }catch(err){
      document.getElementById('loadingMsg').textContent = 'No se pudo cargar. Revisa API_URL.';
    }
  }
  loadFeed();
</script>
</body>
</html>
